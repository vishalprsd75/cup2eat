<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="greenBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B523B"/>
      <stop offset="65%" stop-color="#073D2B"/>
      <stop offset="100%" stop-color="#041E15"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE19B"/>
      <stop offset="40%" stop-color="#D6A64B"/>
      <stop offset="70%" stop-color="#B88730"/>
      <stop offset="100%" stop-color="#F1CD8B"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#greenBg)" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Centered Logo Typography -->
  <g filter="url(#subtleGlow)" text-anchor="middle" font-family="'Playfair Display', Georgia, serif">
    <!-- CUP -->
    <text x="100" y="68" fill="url(#goldGrad)" font-size="28" font-weight="800" letter-spacing="4">CUP</text>
    
    <!-- Divider lines with 2 -->
    <line x1="38" y1="98" x2="76" y2="98" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="100" cy="98" r="17" fill="#05291F" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <text x="100" y="105" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">2</text>
    <line x1="124" y1="98" x2="162" y2="98" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- EAT -->
    <text x="100" y="144" fill="url(#goldGrad)" font-size="28" font-weight="800" letter-spacing="4">EAT</text>
  </g>
  
  <!-- Subtle Tagline Arc / Dots -->
  <circle cx="100" cy="168" r="3" fill="url(#goldGrad)"/>
  <circle cx="86" cy="167" r="2" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="114" cy="167" r="2" fill="url(#goldGrad)" opacity="0.7"/>
</svg>

